<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Techno Generator</title>
<meta name="description" content="Algorithmisch generierter Techno – Vorschau der aktuellen Engine-Version.">
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #17171b;
    --line: #2a2a31;
    --text: #e9e9ee;
    --muted: #8d8d99;
    --accent: #ff3d5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .song {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
  .seed { font-weight: 700; font-size: 1.15rem; }
  .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
  .camelot {
    margin-left: auto;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    padding: 0 10px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  audio { width: 100%; height: 40px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
  pre {
    margin: 8px 0 0;
    padding: 12px;
    background: var(--bg);
    border-radius: 8px;
    overflow-x: auto;
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #c9c9d3;
  }
  footer { color: var(--muted); font-size: 0.85rem; margin-top: 32px; }
  footer code { color: var(--text); }
  .err { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Techno<span>.</span>Generator</h1>
  <p class="sub">Komplett algorithmisch erzeugt und synthetisiert. Keine Samples. Jeder Song ist aus seinem Seed exakt reproduzierbar.</p>
  <div id="songs"><p class="meta">Lade Songs…</p></div>
  <footer id="foot"></footer>
</main>
<script>
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

  async function load() {
    const box = document.getElementById("songs");
    let index;
    try {
      index = await (await fetch("songs.json", { cache: "no-store" })).json();
    } catch (e) {
      box.innerHTML = '<p class="err">songs.json fehlt – Seite wurde noch nicht gebaut.</p>';
      return;
    }
    box.innerHTML = "";
    for (const seed of index.seeds) {
      const info = await (await fetch(`audio/seed-${seed}.txt`)).text().catch(() => "");
      const key = (info.match(/^key\s+(.+?) \((\w+)\)/m) || []);
      const tempo = (info.match(/^tempo\s+(\d+) BPM/m) || [])[1];
      const el = document.createElement("section");
      el.className = "song";
      el.innerHTML = `
        <div class="head">
          <span class="seed">Seed ${seed}</span>
          <span class="meta">${key[1] ? esc(key[1]) : ""}${tempo ? " · " + tempo + " BPM" : ""}</span>
          ${key[2] ? `<span class="camelot">${esc(key[2])}</span>` : ""}
        </div>
        <audio controls preload="none" src="audio/seed-${seed}.mp3"></audio>
        <details><summary>Song-DNA &amp; Aufbau</summary><pre>${esc(info)}</pre></details>`;
      box.appendChild(el);
    }
    // Only one player at a time.
    box.addEventListener("play", (e) => {
      for (const a of box.querySelectorAll("audio")) if (a !== e.target) a.pause();
    }, true);
    const sha = (index.commit || "").slice(0, 7);
    document.getElementById("foot").innerHTML =
      `Build <code>${esc(sha)}</code> · ${esc(index.built || "")} · Feedback-Format: „Seed X, Takt Y, Problem“`;
  }
  load();
</script>
</body>
</html>
