<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Techno Generator</title>
<meta name="description" content="Endloser, live im Browser erzeugter Techno. Dazu DJ-Mixes und einzelne Songs der aktuellen Engine-Version.">
<meta name="theme-color" content="#0d0d0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #17171b;
    --line: #2a2a31;
    --text: #e9e9ee;
    --muted: #8d8d99;
    --accent: #ff3d5a;
    --accent-dim: rgba(255, 61, 90, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 36px 0 12px; }
  .sub { color: var(--muted); margin: 0 0 8px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
  .title { font-weight: 700; font-size: 1.15rem; }
  .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pill {
    margin-left: auto;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    padding: 0 10px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  audio { width: 100%; height: 40px; }
  ol.tracks { list-style: none; margin: 12px 0 0; padding: 0; }
  ol.tracks li {
    display: grid;
    grid-template-columns: 3.4em 1fr auto;
    gap: 2px 10px;
    align-items: baseline;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  ol.tracks li:hover { background: rgba(255, 255, 255, 0.04); }
  ol.tracks li.now { background: var(--accent-dim); }
  ol.tracks li.now .time { color: var(--accent); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); }
  .song-key { font-weight: 600; }
  .how { color: var(--muted); font-size: 0.85rem; grid-column: 2; }
  .cam { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
  pre {
    margin: 8px 0 0;
    padding: 12px;
    background: var(--bg);
    border-radius: 8px;
    overflow-x: auto;
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #c9c9d3;
  }
  .live { border-color: rgba(255, 61, 90, 0.35); }
  .play {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; margin: 6px 0 4px; padding: 16px;
    border: 0; border-radius: 12px;
    background: var(--accent); color: #fff;
    font: 600 1.1rem/1 system-ui, sans-serif; cursor: pointer;
  }
  .play:disabled { opacity: 0.6; cursor: progress; }
  .play svg { width: 22px; height: 22px; fill: currentColor; }
  .play .ico-pause { display: none; }
  .play[data-state="playing"] .ico-play { display: none; }
  .play[data-state="playing"] .ico-pause { display: inline; }
  .live-now { margin-top: 14px; }
  .now-song { font-size: 1.25rem; font-weight: 700; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-top: 12px; }
  .section-name { font-weight: 600; color: var(--accent); }
  .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .track > div { height: 100%; width: 0; background: var(--accent); transition: width 0.3s linear; }
  .track.energy > div { background: linear-gradient(90deg, #ffb13d, var(--accent)); }
  .label { color: var(--muted); font-size: 0.85rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 16px; }
  .controls label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; flex: 1 1 180px; }
  .controls input[type=range] { flex: 1; accent-color: var(--accent); }
  .btn {
    background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 0.9rem; cursor: pointer;
  }
  .btn:hover { border-color: var(--muted); }
  .seed-row { display: flex; gap: 8px; margin-top: 8px; }
  .seed-row input {
    flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit;
  }
  .fb-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .fb-row .label { flex: 1; }
  .thumb { font-size: 1.15rem; padding: 6px 12px; }
  dialog#fb-dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; width: min(460px, calc(100vw - 32px)); margin: auto;
  }
  dialog#fb-dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
  .fb-thumbs { display: flex; gap: 10px; }
  .fb-thumb {
    flex: 1; font-size: 1.6rem; padding: 10px; border-radius: 10px; cursor: pointer;
    background: var(--bg); border: 1px solid var(--line); opacity: 0.45;
  }
  .fb-thumb.on { opacity: 1; border-color: var(--accent); }
  .fb-where { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 0.85rem; margin: 12px 0; }
  .fb-where b { color: var(--text); font-weight: 600; }
  .fb textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; font: inherit; resize: vertical;
  }
  .fb-hint { color: var(--muted); font-size: 0.8rem; margin: 8px 0 12px; }
  .fb-actions { display: flex; gap: 10px; }
  .fb-actions .btn { flex: 1; }
  .fb-actions .play { flex: 2; margin: 0; padding: 10px; font-size: 1rem; }
  .fb-list { list-style: none; margin: 0 0 12px; padding: 0; }
  .fb-list li { display: grid; grid-template-columns: 1.8em 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .fb-icon { font-size: 1.1rem; }
  .fb-w { color: var(--muted); font-size: 0.85rem; }
  .fb-c { font-size: 0.95rem; }
  .fb-del { background: none; border: 0; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 2px 6px; }
  .fb-export { flex-wrap: wrap; }
  .fb-export .btn { flex: 1 1 auto; text-align: center; text-decoration: none; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font: inherit; cursor: pointer; }
  #fb-toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: #2a2a31; color: var(--text); padding: 10px 16px; border-radius: 999px;
    font-size: 0.9rem; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 10;
    max-width: calc(100vw - 32px);
  }
  #fb-toast.show { opacity: 1; transform: translate(-50%, 0); }
  #fb-toast.show { pointer-events: auto; }
  .fb-toast-action { margin-left: 12px; color: var(--accent); }
  footer { color: var(--muted); font-size: 0.85rem; margin-top: 32px; }
  footer code { color: var(--text); }
  .err { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Techno<span>.</span>Generator</h1>
  <p class="sub">Komplett algorithmisch erzeugt und synthetisiert. Keine Samples. Jeder Song und jeder Mix ist aus seinem Seed exakt reproduzierbar.</p>

  <h2>Live</h2>
  <section class="card live">
    <div class="head">
      <span class="title">Endlos-Set</span>
      <span class="pill" id="lv-cam">live</span>
    </div>
    <button class="play" id="lv-play" data-state="idle">
      <svg class="ico-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg class="ico-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
      <span>Live starten</span>
    </button>
    <p class="err" id="lv-error" hidden></p>
    <div class="live-now" id="lv-info" hidden>
      <div class="row"><span class="now-song" id="lv-song">–</span><span class="meta" id="lv-key"></span></div>
      <div class="row"><span class="section-name" id="lv-section">–</span><span class="label" id="lv-bars"></span></div>
      <div class="track"><div id="lv-progress"></div></div>
      <div class="row"><span class="label">Energie</span></div>
      <div class="track energy"><div id="lv-energy"></div></div>
      <div class="row"><span id="lv-next"></span></div>
      <div class="row"><span class="label" id="lv-time"></span><span class="label" id="lv-songbar"></span></div>
      <div class="fb-row">
        <span class="label">Feedback zu dieser Stelle</span>
        <button class="btn thumb" id="lv-up" aria-label="Daumen hoch">👍</button>
        <button class="btn thumb" id="lv-down" aria-label="Daumen runter">👎</button>
        <button class="btn thumb" id="lv-idea" aria-label="Idee">💡</button>
      </div>
    </div>
    <div class="controls">
      <label>Lautstärke <input type="range" id="lv-vol" min="0" max="1" step="0.01" value="0.85"></label>
      <button class="btn" id="lv-new">Neues Set</button>
    </div>
    <details>
      <summary>Set-Seed (gleicher Seed = gleiches Set)</summary>
      <div class="seed-row"><input id="lv-seed" inputmode="numeric" aria-label="Set-Seed"><button class="btn" id="lv-seed-go">Starten</button></div>
    </details>
  </section>

  <h2>Dein Feedback</h2>
  <section class="card" id="fb-inbox"></section>

  <h2>Mixes</h2>
  <div id="mixes"><p class="meta">Lade…</p></div>

  <h2>Einzelne Songs</h2>
  <div id="songs"></div>

  <footer id="foot"></footer>
</main>
<script>
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const mmss = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
  // Engine key names ("F# phrygian") -> German ("Fis phrygisch").
  const DE_NOTE = { "C": "C", "C#": "Cis", "D": "D", "D#": "Es", "E": "E", "F": "F", "F#": "Fis", "G": "G", "G#": "Gis", "A": "A", "A#": "B", "B": "H" };
  const deKey = (k) => {
    const m = /^([A-G]#?) (.+)$/.exec(k || "");
    if (!m) return k;
    const n = DE_NOTE[m[1]] || m[1];
    return { "minor": `${n}-Moll`, "phrygian": `${n} phrygisch`, "harmonic minor": `${n} harmonisch Moll` }[m[2]] || k;
  };
  const HOW = { "cut": "harter Cut", "fast blend": "schnelle Blende", "slow blend": "langsame Blende", "filter blend": "Filter-Blende" };

  // Only one player at a time.
  document.addEventListener("play", (e) => {
    for (const a of document.querySelectorAll("audio")) if (a !== e.target) a.pause();
  }, true);

  async function getJson(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(url);
    return r.json();
  }

  function mixCard(seed, set) {
    const el = document.createElement("section");
    el.className = "card";
    const songs = set.songs || [];
    el.innerHTML = `
      <div class="head">
        <span class="title">Mix #${seed}</span>
        <span class="meta">${songs.length} Songs · ${set.bpm} BPM · ${mmss(set.duration)}</span>
      </div>
      <audio controls preload="none" src="audio/mix-${seed}.mp3"></audio>
      <div class="fb-row">
        <span class="label">Feedback zur aktuellen Stelle</span>
        <button class="btn thumb" data-r="up" aria-label="Daumen hoch">👍</button>
        <button class="btn thumb" data-r="down" aria-label="Daumen runter">👎</button>
        <button class="btn thumb" data-r="idea" aria-label="Idee">💡</button>
      </div>
      <ol class="tracks">${songs.map((s, i) => `
        <li data-start="${s.start}" data-i="${i}">
          <span class="time">${mmss(s.start)}</span>
          <span class="song-key">${esc(deKey(s.key))}</span>
          <span class="cam">${esc(s.camelot)}</span>
          <span class="how">${s.transition ? esc(HOW[s.transition] || s.transition) : "Start"} · Seed ${s.seed}</span>
        </li>`).join("")}
      </ol>
      <details><summary>Aufbau der Songs</summary><pre>${songs.map((s) =>
        `#${s.index + 1}  Seed ${s.seed}  ${esc(deKey(s.key))} (${esc(s.camelot)})\n${esc(s.structure)}`).join("\n\n")}</pre></details>`;
    const audio = el.querySelector("audio");
    const rows = [...el.querySelectorAll("li")];
    el.querySelectorAll(".fb-row .thumb").forEach((b) => b.addEventListener("click", () => {
      const t = audio.currentTime;
      let cur = 0;
      songs.forEach((s, i) => { if (t >= s.start) cur = i; });
      const s = songs[cur] || {};
      window.TechnoFeedback && window.TechnoFeedback.open({
        source: "Mix", mixSeed: seed, mixSongs: songs.length, songIndex: cur, songSeed: s.seed,
        key: deKey(s.key), camelot: s.camelot, bpm: set.bpm, time: mmss(t),
      }, b.dataset.r);
    }));
    const mark = (cur) => rows.forEach((li, i) => li.classList.toggle("now", i === cur));
    rows.forEach((li, i) => li.addEventListener("click", () => {
      const t = parseFloat(li.dataset.start);
      mark(i);
      // With preload="none" the position can only be set once metadata is known.
      if (audio.readyState >= 1) audio.currentTime = t;
      else audio.addEventListener("loadedmetadata", () => { audio.currentTime = t; }, { once: true });
      audio.play().catch(() => {});
    }));
    audio.addEventListener("timeupdate", () => {
      const t = audio.currentTime;
      let cur = 0;
      rows.forEach((li, i) => { if (t >= parseFloat(li.dataset.start)) cur = i; });
      if (!audio.paused) mark(cur);
    });
    return el;
  }

  async function songCard(seed) {
    const info = await fetch(`audio/seed-${seed}.txt`).then((r) => r.text()).catch(() => "");
    const key = info.match(/^key\s+(.+?) \((\w+)\)/m) || [];
    const tempo = (info.match(/^tempo\s+(\d+) BPM/m) || [])[1];
    const sounds = (info.match(/^sounds\s+(.+)$/m) || [])[1];
    const el = document.createElement("section");
    el.className = "card";
    el.innerHTML = `
      <div class="head">
        <span class="title">Seed ${seed}</span>
        <span class="meta">${key[1] ? esc(deKey(key[1])) : ""}${tempo ? " · " + tempo + " BPM" : ""}</span>
        ${key[2] ? `<span class="pill">${esc(key[2])}</span>` : ""}
      </div>
      <audio controls preload="none" src="audio/seed-${seed}.mp3"></audio>
      ${sounds ? `<p class="meta" style="margin:8px 0 0;font-size:.9rem">${esc(sounds)}</p>` : ""}
      <details><summary>Song-DNA &amp; Aufbau</summary><pre>${esc(info)}</pre></details>`;
    return el;
  }

  async function load() {
    const mixBox = document.getElementById("mixes");
    const songBox = document.getElementById("songs");
    let index;
    try {
      index = await getJson("songs.json");
    } catch (e) {
      mixBox.innerHTML = '<p class="err">songs.json fehlt – Seite wurde noch nicht gebaut.</p>';
      return;
    }
    mixBox.innerHTML = "";
    for (const seed of index.mixes || []) {
      try {
        mixBox.appendChild(mixCard(seed, await getJson(`audio/mix-${seed}.json`)));
      } catch (e) {
        mixBox.insertAdjacentHTML("beforeend", `<p class="err">Mix ${seed} fehlt.</p>`);
      }
    }
    if (!(index.mixes || []).length) mixBox.innerHTML = '<p class="meta">Noch keine Mixes.</p>';
    for (const seed of index.seeds || []) songBox.appendChild(await songCard(seed));

    const sha = (index.commit || "").slice(0, 7);
    document.getElementById("foot").innerHTML =
      `Build <code>${esc(sha)}</code> · ${esc(index.built || "")} · Feedback-Format: „Mix X, Minute Y, Problem“ oder „Seed X, Takt Y, Problem“`;
  }
  load();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
<script src="app/feedback.js"></script>
<script type="module" src="app/live.js"></script>
</body>
</html>
