name: pages

# Builds the preview site (rendered songs + DNA) and deploys it to GitHub Pages.
# Requires: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every 3 hours: render fresh mixes (the whole site is redeployed with them).
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techno
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: techno
      - run: cargo test --workspace
      - run: cargo build --release
      - run: cargo build --release -p techno-web --target wasm32-unknown-unknown
      # Install ffmpeg robustly (stale package indexes on runners caused 404s).
      - name: Install ffmpeg
        run: |
          command -v ffmpeg >/dev/null || for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null && break
            echo "apt failed, retrying ($i)"; sleep 10
          done
          ffmpeg -version | head -1
      # One new 10-song mix per genre and push; previous mixes are taken over from the live site.
      - run: scripts/build_site.sh ../_site
        env:
          MIX_SONGS: "10"
          KEEP: "4"
          SEED_SALT: ${{ github.run_number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
