name: techno

on:
  push:
    paths: ["techno/**", ".github/workflows/techno.yml"]
  pull_request:
    paths: ["techno/**", ".github/workflows/techno.yml"]

defaults:
  run:
    working-directory: techno

jobs:
  test-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: techno
      - run: cargo test --workspace
      - run: cargo build --release
      - run: cargo build --release -p techno-web --target wasm32-unknown-unknown
      - name: Render preview songs
        run: |
          command -v ffmpeg >/dev/null || for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null && break
            echo "apt failed, retrying ($i)"; sleep 10
          done
          ffmpeg -version | head -1
          mkdir -p preview
          for genre in techno house; do
            for seed in 1 7 2026; do
              f=preview/$genre-seed-$seed
              ./target/release/techno render --genre $genre --seed $seed --out $f.wav
              ffmpeg -loglevel error -y -i $f.wav -b:a 192k $f.mp3
              ./target/release/techno info --genre $genre --seed $seed > $f.txt
              rm $f.wav
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.sha }}
          path: techno/preview
